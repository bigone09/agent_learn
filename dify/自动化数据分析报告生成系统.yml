    - data:
        code: "import json\nimport re\nimport ast\n\ndef main(code: str) -> dict:\n\
          \    s = code.strip()\n\n    # 1. 清洗:剥围栏、截取JSON主体\n    m = re.search(r\"\
          ```(?:json)?\\s*(.*)\\s*```\", s, re.S)\n    if m:\n        s = m.group(1).strip()\n\
          \    else:\n        start, end = s.find(\"{\"), s.rfind(\"}\")\n       \
          \ if start != -1 and end > start:\n            s = s[start:end + 1]\n\n\
          \    # 2. 解析成 dict\n    try:\n        cfg = json.loads(s)\n    except json.JSONDecodeError:\n\
          \        cfg = ast.literal_eval(s)\n\n    # 3. 关键:包进 echarts 代码块\n    output\
          \ = \"\\n```echarts\\n\" + json.dumps(cfg, indent=2, ensure_ascii=False)\
          \ + \"\\n```\"\n    return {\"output\": output}\n"
