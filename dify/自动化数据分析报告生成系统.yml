            ECharts option 对象。

            步骤：

            1.你需要根据用户的分析需求{{#sys.query#}}来决定使用什么图表类型

            2.对提供的数据{{#sys.files#}}进行可视化代码编写，注意样例数据{{#1792072537226.text#}}只有前五行

            严格要求:

            1. 只输出一个 JSON 对象,不要任何解释文字,不要 markdown 代码块标记(不要 ```)

            2. 必须使用输入数据中的真实数值,禁止编造,禁止用pd.read_csv 或任何文件读取

            3. 根据数据维度和分析目标推荐图表类型

            4. 中文标签保持中文

            5. series 里的数值必须是数字类型,不要加引号'
